[project]
name = "maj-logiciel"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyqt5>=5.15.11",
    "pyqt5-qt5==5.15.2",
]

[project.scripts]
maj-logiciel = "maj_logiciel:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
